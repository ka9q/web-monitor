# Before Debian's 50-default.conf: listener records go only to this file.
# SyslogIdentifier is set explicitly in web-monitor.service.
if ($programname == "web-monitor" and $msg contains "web-monitor.listener:listener {") then {
    action(type="omfile" file="/var/log/web-monitor.log"
           fileOwner="root" fileGroup="adm" fileCreateMode="0640")
    stop
}
